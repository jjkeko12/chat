<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat de amigos</title>
<style>
  :root { --bg:#f5f5f4; --panel:#fff; --text:#1c1917; --muted:#78716c; --mine:#2563eb; --mine-text:#fff; --other:#e7e5e4; --line:#d6d3d1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1917; --panel:#292524; --text:#fafaf9; --muted:#a8a29e; --mine:#3b82f6; --mine-text:#fff; --other:#44403c; --line:#44403c; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; }
  [hidden] { display: none !important; }
  header { padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  header h1 { font-size: 1.1rem; margin: 0; }
  #online, #status { font-size: .8rem; color: var(--muted); margin-top: 2px; min-height: 1em; }
  #msgs { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: min(80%, 640px); align-self: flex-start; }
  .msg.mine { align-self: flex-end; }
  .meta { font-size: .7rem; color: var(--muted); margin: 0 4px 2px; }
  .msg.mine .meta { text-align: right; }
  .body { background: var(--other); padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.mine .body { background: var(--mine); color: var(--mine-text); }
  .sys { align-self: center; font-size: .8rem; color: var(--muted); text-align: center; max-width: 90%; }
  .msg.me .body { background: none; font-style: italic; padding: 0 4px; color: var(--muted); }
  header { position: relative; }
  .bars { background: none; padding: 8px; display: flex; flex-direction: column; gap: 3px; }
  .bars span { display: block; width: 18px; height: 2px; background: var(--text); border-radius: 2px; }
  #menu { position: absolute; right: 12px; top: 100%; z-index: 10; width: min(300px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  #menu h2 { font-size: .9rem; margin: 0; }
  #menu input { flex: none; width: 100%; font-size: .9rem; }
  #menu hr { border: 0; border-top: 1px solid var(--line); width: 100%; margin: 4px 0; }
  #menumsg, #pushmsg { font-size: .8rem; color: var(--muted); min-height: 1em; overflow-wrap: anywhere; }
  #msgs { background-size: cover; background-position: center; }
  .hasbg .meta, .hasbg .sys { background: var(--panel); padding: 1px 8px; border-radius: 8px; width: fit-content; }
  .hasbg .msg.mine .meta { margin-left: auto; }
  #app { position: relative; }
  #members { width: 170px; flex: none; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 12px; }
  #members h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  #memberList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #memberList li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #chat { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .onlyNarrow { display: none; }
  @media (max-width: 600px) {
    #members { display: none; position: absolute; right: 0; top: 0; bottom: 0; z-index: 9; box-shadow: -4px 0 16px rgba(0,0,0,.3); }
    #members.open { display: block; }
    .onlyNarrow { display: block; }
  }
  .body.media { padding: 4px; }
  .body.image img { display: block; max-width: min(440px, 75vw); max-height: 440px; width: auto; height: auto; border-radius: 10px; }
  .body.sticker img { display: block; width: 160px; height: auto; }
  .body.media.sticker, .msg.mine .body.media.sticker { background: none; padding: 0; }
  #preview { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--panel); border-top: 1px solid var(--line); }
  #preview img { max-height: 72px; max-width: 120px; border-radius: 8px; }
  #stickerPanel { background: var(--panel); border-top: 1px solid var(--line); padding: 8px 16px; max-height: 40vh; overflow-y: auto; }
  .stkHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  #stickerPanel .hint { font-size: .75rem; color: var(--muted); margin-bottom: 8px; }
  #stkGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
  .stk { position: relative; }
  .stk img { width: 100%; height: 64px; object-fit: contain; cursor: pointer; display: block; }
  .stk button { position: absolute; top: -4px; right: -4px; padding: 0 5px; font-size: .7rem; border-radius: 50%; background: var(--other); color: var(--text); line-height: 1.4; }
  button.icon { padding: 10px 12px; }
  #rooms { width: 210px; flex: none; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  #rooms h3, #memBox h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 10px 0 4px; }
  button.room { width: 100%; text-align: left; background: none; color: var(--text); padding: 8px 10px; display: flex; justify-content: space-between; gap: 6px; }
  button.room.active { background: var(--other); }
  .badge { background: var(--mine); color: var(--mine-text); border-radius: 10px; padding: 0 7px; font-size: .75rem; }
  #memBox ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #memBox li { display: flex; justify-content: space-between; align-items: center; gap: 6px; overflow: hidden; }
  #memBox li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #memBox li button { padding: 0 8px; }
  #memBox > button { margin-top: 12px; width: 100%; }
  .link { cursor: pointer; }
  .link:hover { text-decoration: underline; }
  #dlg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .dlgbox { background: var(--panel); border-radius: 14px; padding: 16px; width: min(380px, 100%); max-height: 80vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .dlgbox h2 { margin: 0; font-size: 1.1rem; }
  .pick { display: flex; flex-direction: column; gap: 6px; }
  .pick label { display: flex; gap: 8px; align-items: center; }
  .pick input[type=checkbox] { flex: none; width: auto; padding: 0; }
  #dlgMsg { font-size: .85rem; color: #dc2626; min-height: 1em; }
  textarea { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 1rem; line-height: 1.3; resize: none; max-height: 140px; overflow-y: auto; }
  #form { align-items: flex-end; }
  @media (max-width: 600px) {
    #rooms { display: none; position: absolute; left: 0; top: 0; bottom: 0; z-index: 9; box-shadow: 4px 0 16px rgba(0,0,0,.3); }
    #rooms.open { display: flex; }
  }
  form { display: flex; gap: 8px; padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--line); }
  input { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 1rem; }
  button { padding: 10px 18px; border: none; border-radius: 10px; background: var(--mine); color: var(--mine-text); font-size: 1rem; cursor: pointer; }
  button.sec { background: var(--other); color: var(--text); }
  #auth { margin: auto; width: 100%; max-width: 420px; padding: 24px 16px; }
  #auth form { flex-direction: column; border: 1px solid var(--line); border-radius: 14px; }
  #auth h1 { text-align: center; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  #authmsg { font-size: .85rem; color: var(--muted); min-height: 1.2em; }
</style>
</head>
<body>

<div id="auth" hidden>
  <h1>💬 Chat de amigos</h1>
  <form id="authform">
    <input id="ident" maxlength="60" placeholder="Tu nombre" autocomplete="username" required />
    <input id="pass" type="password" placeholder="Contraseña (mín. 6 caracteres)" autocomplete="current-password" minlength="6" required />
    <input id="email" type="email" placeholder="Correo (solo para crear la cuenta; puede ser inventado)" autocomplete="email" hidden />
    <div class="row">
      <button type="submit" id="btnLogin">Entrar</button>
      <button type="button" id="btnSignup" class="sec">Crear cuenta</button>
    </div>
    <div id="authmsg"></div>
  </form>
</div>

<div id="app" hidden style="display:flex;flex-direction:row;flex:1;min-height:0">
  <aside id="rooms">
    <strong>Chats</strong>
    <div id="roomList"></div>
    <button id="newGroup" type="button" class="sec">➕ Nuevo grupo</button>
    <button id="newDm" type="button" class="sec">✉️ Chat privado</button>
  </aside>
  <div id="chat">
  <header>
    <div>
      <h1 id="roomTitle">💬 Chat de amigos</h1>
      <div id="online"></div>
      <div id="status">Conectando…</div>
    </div>
    <button id="menuBtn" class="bars" type="button" aria-label="Menú"><span></span><span></span><span></span></button>
    <div id="menu" hidden>
      <h2>Fondo del chat</h2>
      <input id="bgUrl" type="text" placeholder="https://… (enlace de una imagen)" />
      <button id="bgApply" type="button">Usar este enlace</button>
      <input id="bgFile" type="file" accept="image/*" />
      <button id="bgClear" type="button" class="sec">Quitar fondo</button>
      <div id="menumsg"></div>
      <button id="roomsBtn" type="button" class="sec onlyNarrow">Ver chats</button>
      <button id="memBtn" type="button" class="sec onlyNarrow">Ver miembros</button>
      <hr />
      <h2>Notificaciones</h2>
      <button id="pushBtn" type="button" class="sec">🔔 Activar notificaciones</button>
      <button id="pushTest" type="button" class="sec" hidden>Probar notificación</button>
      <div id="pushmsg"></div>
      <hr />
      <button id="passBtn" type="button" class="sec">🔑 Cambiar mi contraseña</button>
      <button id="logout" class="sec" type="button">Salir</button>
    </div>
  </header>
  <div id="msgs"></div>
  <div id="preview" hidden>
    <img id="prevImg" alt="" />
    <button id="prevSend" type="button">Enviar imagen</button>
    <button id="prevCancel" type="button" class="sec">Cancelar</button>
  </div>
  <div id="stickerPanel" hidden>
    <div class="stkHead">
      <strong>Mis stickers</strong>
      <button id="stkAdd" type="button" class="sec">➕ Agregar</button>
    </div>
    <div class="hint">Con este panel abierto puedes arrastrar o pegar (Ctrl+V) una imagen para guardarla como sticker.</div>
    <div id="stkGrid"></div>
  </div>
  <form id="form">
    <button id="stkBtn" type="button" class="icon sec" title="Stickers">😊</button>
    <button id="imgBtn" type="button" class="icon sec" title="Enviar una imagen">📎</button>
    <textarea id="input" rows="1" maxlength="500" placeholder="Escribe un mensaje…"></textarea>
    <button type="submit">Enviar</button>
  </form>
  <input id="imgFile" type="file" accept="image/*" hidden />
  <input id="stkFile" type="file" accept="image/*" multiple hidden />
  </div>
  <aside id="members"><div id="memBox"></div></aside>
</div>

<div id="dlg" hidden>
  <div class="dlgbox">
    <h2 id="dlgTitle"></h2>
    <div id="dlgBody"></div>
    <div id="dlgMsg"></div>
    <div class="row">
      <button id="dlgOk" type="button">Aceptar</button>
      <button id="dlgClose" type="button" class="sec">Cerrar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // ---------- CONFIGURACIÓN: rellena estos 3 valores ----------
  const SUPABASE_URL = 'https://rjyhgwijofiepieltrra.supabase.co/rest/v1/';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqeWhnd2lqb2ZpZXBpZWx0cnJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMTA3NzksImV4cCI6MjEwNzY4Njc3OX0.bfHO5ewx11znaeWtTm74Q2vQYopl2HqQsYQPSmYGeYM';
  const VAPID_PUBLIC_KEY = 'BKr56Yml-2jWpBf89cxHlGwlj2KlEMcpA5DC7Hp1P5npnQaMQr9ohVSJoag8QQsW2ezshCP7y8U0dCG84tz9Ngg'; // clave pública VAPID (la privada va solo en Vercel)
  // ------------------------------------------------------------

  // .origin recorta cualquier cosa extra que se haya pegado (/rest/v1, diagonales, etc.)
  const db = supabase.createClient(new URL(SUPABASE_URL).origin, SUPABASE_KEY);
  const $ = (id) => document.getElementById(id);
  let channel = null, me = null, myName = '';
  const seen = new Set();
  const els = new Map();

  function authMsg(t) { $('authmsg').textContent = t; }
  function friendly(err) {
    const m = err.message || String(err);
    if (/invalid login/i.test(m)) return 'Correo o contraseña incorrectos.';
    if (/already registered/i.test(m)) return 'Ese correo ya tiene cuenta. Usa "Entrar".';
    if (/signups not allowed/i.test(m)) return 'El registro de cuentas nuevas está cerrado.';
    if (/database error/i.test(m)) return 'No se pudo crear la cuenta con ese correo.';
    if (/password/i.test(m)) return 'Contraseña inválida: usa al menos 6 caracteres.';
    return m;
  }

  $('authform').addEventListener('submit', async (e) => {
    e.preventDefault();
    const ident = $('ident').value.trim();
    let email = ident;
    authMsg('Entrando…');
    if (!ident.includes('@')) {
      const { data: mail } = await db.rpc('email_por_nombre', { p_nombre: ident });
      if (!mail) return authMsg('Nombre o contraseña incorrectos.');
      email = mail;
    }
    const { data, error } = await db.auth.signInWithPassword({ email, password: $('pass').value });
    if (error) return authMsg(friendly(error));
    start(data.user);
  });

  $('btnSignup').addEventListener('click', async () => {
    const name = $('ident').value.trim();
    if (!name) return authMsg('Escribe el nombre que quieres usar.');
    if (name.includes('@')) return authMsg('El nombre no puede llevar @.');
    if (name.length > 30) return authMsg('El nombre puede tener máximo 30 letras.');
    if ($('email').hidden) {
      $('email').hidden = false;
      return authMsg('Escribe un correo (puede ser inventado) y pulsa "Crear cuenta" otra vez.');
    }
    const email = $('email').value.trim();
    if (!email) return authMsg('Falta el correo.');
    if ($('pass').value.length < 6) return authMsg('La contraseña debe tener al menos 6 caracteres.');
    authMsg('Creando cuenta…');
    const { data: libre } = await db.rpc('nombre_disponible', { p_nombre: name });
    if (libre === false) return authMsg('Ese nombre ya está en uso. Elige otro.');
    const { data, error } = await db.auth.signUp({
      email, password: $('pass').value, options: { data: { name } }
    });
    if (error) return authMsg(friendly(error));
    if (!data.session) return authMsg('Cuenta creada. Revisa tu correo para confirmarla y luego pulsa "Entrar".');
    start(data.user);
  });

  $('logout').addEventListener('click', async () => {
    if (channel) await db.removeChannel(channel);
    try {
      const r = pushOk && await navigator.serviceWorker.getRegistration();
      const sb = r && await r.pushManager.getSubscription();
      if (sb) await db.rpc('borrar_suscripcion', { p_endpoint: sb.endpoint });
    } catch (e) {}
    await db.auth.signOut();
    location.reload();
  });

  // ----- Menú y fondo (el fondo se guarda solo en este navegador) -----
  function applyBg(src) {
    $('msgs').style.backgroundImage = src ? 'url("' + src.replace(/["\\\n\r]/g, '') + '")' : '';
    document.body.classList.toggle('hasbg', !!src);
  }
  function saveBg(src) {
    try {
      if (src) localStorage.setItem('chat_bg', src); else localStorage.removeItem('chat_bg');
      return true;
    } catch (e) { return false; }
  }
  function menuMsg(t) { $('menumsg').textContent = t; }

  $('menuBtn').addEventListener('click', (e) => { e.stopPropagation(); $('menu').hidden = !$('menu').hidden; });
  $('menu').addEventListener('click', (e) => e.stopPropagation());
  document.addEventListener('click', () => { $('menu').hidden = true; });

  $('bgApply').addEventListener('click', () => {
    const u = $('bgUrl').value.trim();
    if (!/^https:\/\//i.test(u)) return menuMsg('El enlace debe empezar con https://');
    applyBg(u); saveBg(u); menuMsg('Fondo aplicado.');
  });

  $('bgFile').addEventListener('change', () => {
    const f = $('bgFile').files[0];
    if (!f) return;
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const data = c.toDataURL('image/jpeg', 0.8);
      URL.revokeObjectURL(img.src);
      applyBg(data);
      menuMsg(saveBg(data) ? 'Fondo aplicado.' : 'Fondo aplicado, pero pesa demasiado para guardarlo: se perderá al recargar.');
    };
    img.onerror = () => menuMsg('No se pudo leer esa imagen.');
    img.src = URL.createObjectURL(f);
  });

  $('bgClear').addEventListener('click', () => {
    applyBg(''); saveBg(''); $('bgUrl').value = ''; $('bgFile').value = ''; menuMsg('Fondo quitado.');
  });
  try { applyBg(localStorage.getItem('chat_bg') || ''); } catch (e) {}

  // ----- Salas: General, grupos y chats privados -----
  let rooms = [], roomMembers = [], profilesList = [], cur = null;
  const unread = {};
  const byName = (a, b) => a.name.localeCompare(b.name, 'es', { sensitivity: 'base' });
  let _t = null;
  function loadMembers() { clearTimeout(_t); _t = setTimeout(loadAll, 250); }
  function icon(r) { return r.kind === 'dm' ? '@ ' : r.kind === 'group' ? '# ' : '💬 '; }
  function roomTitle(r) {
    if (r.kind === 'general') return 'General';
    if (r.kind === 'group') return r.name || 'Grupo';
    const o = roomMembers.find((x) => x.room_id === r.id && x.user_id !== me.id);
    const p = o && profilesList.find((q) => q.user_id === o.user_id);
    return p ? p.name : 'Chat privado';
  }
  function setTitle() { $('roomTitle').textContent = cur ? icon(cur) + roomTitle(cur) : '💬 Chat de amigos'; }

  function updateOnline() {
    if (!channel) return;
    const allowed = cur && cur.kind !== 'general'
      ? new Set(roomMembers.filter((x) => x.room_id === cur.id).map((x) => x.user_id)) : null;
    const names = Object.entries(channel.presenceState())
      .filter(([uid]) => !allowed || allowed.has(uid)).map(([, v]) => v[0].name);
    $('online').textContent = 'En línea (' + names.length + '): ' + names.join(', ');
  }

  function renderRooms() {
    const box = $('roomList');
    box.replaceChildren();
    [['', 'general'], ['Grupos', 'group'], ['Chats privados', 'dm']].forEach(([title, kind]) => {
      const list = rooms.filter((r) => r.kind === kind);
      if (!list.length) return;
      if (title) { const h = document.createElement('h3'); h.textContent = title; box.append(h); }
      list.sort((a, b) => roomTitle(a).localeCompare(roomTitle(b), 'es', { sensitivity: 'base' })).forEach((r) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'room' + (cur && cur.id === r.id ? ' active' : '');
        const n = document.createElement('span');
        n.textContent = icon(r) + roomTitle(r);
        b.append(n);
        if (unread[r.id]) { const u = document.createElement('span'); u.className = 'badge'; u.textContent = unread[r.id]; b.append(u); }
        b.onclick = () => openRoom(r.id);
        box.append(b);
      });
    });
  }

  function renderMembers() {
    const box = $('memBox');
    box.replaceChildren();
    if (!cur) return;
    const ids = new Set(roomMembers.filter((x) => x.room_id === cur.id).map((x) => x.user_id));
    const inside = cur.kind === 'general' ? profilesList : profilesList.filter((p) => ids.has(p.user_id));
    const outside = cur.kind === 'group' ? profilesList.filter((p) => !ids.has(p.user_id)) : [];
    const section = (title, people, canAdd) => {
      const h = document.createElement('h3');
      h.textContent = title + ' — ' + people.length;
      const ul = document.createElement('ul');
      people.slice().sort(byName).forEach((p) => {
        const li = document.createElement('li');
        const s = document.createElement('span');
        const owner = roomMembers.some((x) => x.room_id === cur.id && x.user_id === p.user_id && x.role === 'owner');
        s.textContent = p.name + (owner ? ' 👑' : '');
        if (!canAdd && p.user_id !== me.id) { s.className = 'link'; s.title = 'Abrir chat privado'; s.onclick = () => openDm(p.name); }
        li.append(s);
        if (canAdd) {
          const b = document.createElement('button');
          b.type = 'button'; b.textContent = '＋'; b.title = 'Agregar al grupo';
          b.onclick = async () => {
            const { error } = await db.rpc('agregar_a_grupo', { p_room: cur.id, p_nombre: p.name });
            if (error) local('⚠️ ' + error.message);
          };
          li.append(b);
        }
        ul.append(li);
      });
      box.append(h, ul);
    };
    section(cur.kind === 'general' ? 'Todos' : 'En este chat', inside, false);
    if (cur.kind === 'group') {
      section('No están en este chat', outside, true);
      const leave = document.createElement('button');
      leave.type = 'button'; leave.className = 'sec'; leave.textContent = 'Salir del grupo';
      leave.onclick = async () => {
        if (!confirm('¿Salir de «' + cur.name + '»?')) return;
        const { error } = await db.rpc('salir_del_grupo', { p_room: cur.id });
        if (error) local('⚠️ ' + error.message);
      };
      box.append(leave);
    }
  }

  async function loadAll() {
    if (!me) return;
    const [r, m, p] = await Promise.all([
      db.from('rooms').select('id,kind,name'),

      db.from('profiles').select('user_id,name'),
    ]);

      return;

    if (cur) cur = rooms.find((x) => x.id === cur.id);
    setTitle(); renderRooms(); renderMembers(); updateOnline();

  const pushOk = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

  function b64ToBytes(b64) {
    const pad = '='.repeat((4 - (b64.length % 4)) % 4);
    const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
    return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
  }
  async function getSub() {
    const reg = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    return { reg, sub: await reg.pushManager.getSubscription() };
  }
  async function savePush(sub) {
    const j = sub.toJSON();
    const { error } = await db.rpc('guardar_suscripcion',
      { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
    return !error;
  }
  async function refreshPushUi() {
    const btn = $('pushBtn'), msg = $('pushmsg');
    $('pushTest').hidden = true;
    if (!pushOk) { btn.hidden = true; msg.textContent = 'Este navegador no admite notificaciones.'; return; }
    if (Notification.permission === 'denied') {
      btn.hidden = true;
      msg.textContent = 'Las notificaciones están bloqueadas: actívalas en los permisos del sitio (candado junto a la dirección).';
      return;
    }
    btn.hidden = false;
    let sub = null;
    try { sub = (await getSub()).sub; } catch (e) {}
    const on = Notification.permission === 'granted' && !!sub;
    btn.textContent = on ? '🔕 Desactivar notificaciones' : '🔔 Activar notificaciones';
    btn.dataset.on = on ? '1' : '';
    $('pushTest').hidden = !on;
    msg.textContent = on ? 'Activadas en este dispositivo.' : '';
    if (on && me) savePush(sub); // vincula este dispositivo a la cuenta que está abierta
  }
  $('pushBtn').addEventListener('click', async () => {
    const msg = $('pushmsg');
    try {
      if ($('pushBtn').dataset.on) {
        const { sub } = await getSub();
        if (sub) { await db.rpc('borrar_suscripcion', { p_endpoint: sub.endpoint }); await sub.unsubscribe(); }
        return refreshPushUi();
      }
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { msg.textContent = 'No se concedió el permiso.'; return refreshPushUi(); }
      const { reg, sub: old } = await getSub();
      const sub = old || await reg.pushManager.subscribe({
        userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC_KEY)
      });
      if (!(await savePush(sub))) { msg.textContent = 'No se pudo guardar la suscripción.'; return; }
      refreshPushUi();

  // ----- Imágenes y stickers (cosas distintas: las imágenes son grandes, los stickers pequeños) -----
  const MEDIA_BASE = new URL(SUPABASE_URL).origin + '/storage/v1/object/public/chat-media/';
  let pendingImg = null, pendingUrl = '', stickers = [];

  function isImg(f) { return !!(f && f.type && f.type.startsWith('image/')); }

  function processImage(file, max, mime, quality, whiteBg) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * k));
        c.height = Math.max(1, Math.round(img.height * k));
        const ctx = c.getContext('2d');
        if (whiteBg) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob((b) => (b ? resolve(b) : reject(new Error('No se pudo procesar la imagen.'))), mime, quality);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo leer esa imagen.')); };
      img.src = url;
    });
  }

  async function uploadMedia(blob) {
    const ext = blob.type === 'image/webp' ? 'webp' : blob.type === 'image/png' ? 'png' : 'jpg';
    const path = me.id + '/' + crypto.randomUUID() + '.' + ext;
    const { error } = await db.storage.from('chat-media')
      .upload(path, blob, { contentType: blob.type, cacheControl: '31536000' });
    if (error) throw error;
    return db.storage.from('chat-media').getPublicUrl(path).data.publicUrl;
  }

  // Imágenes: vista previa y confirmación antes de enviar
  async function prepareImage(file) {

    } catch (e) { local('⚠️ ' + e.message); }
  }

  const AYUDA = 'Comandos:\n/help – muestra esta ayuda\n/me <acción> – mensaje de acción\n/dm <nombre> – abre un chat privado\n/clear – limpia tu pantalla (no borra nada)\n\nSolo administradores:\n/nick <nuevo> – cambia tu nombre\n/nick <actual> > <nuevo> – cambia el nombre de otra persona\n/mute <nombre> [minutos] – silencia (10 min por defecto)\n/unmute <nombre> – quita el silencio\n/delete <1-100> – borra los últimos N mensajes\n/admin <nombre> – da permisos de administrador\n/unadmin <nombre> – los quita\n/pban <nombre> – borra la cuenta de esa persona (permanente)\n/resetpass <nombre> <clave> – da una contraseña temporal nueva a quien la olvidó';

  async function send(body, kind) {
    if (!cur) return false;
    const row = { room_id: cur.id, author: myName, body };
    if (kind) row.kind = kind;
    const { data, error } = await db.from('messages').insert(row).select().single();
    if (error) {

        if (p && p.muted_until && new Date(p.muted_until) > new Date()) {

        } else local('⚠️ No tienes permiso para enviar este mensaje.');
      } else local('⚠️ No se pudo enviar: ' + error.message);
      return false;

    if (cur && data.room_id === cur.id) add(data);

  async function runCommand(text) {
    const parts = text.slice(1).trim().split(/\s+/);
    const cmd = (parts.shift() || '').toLowerCase();
    const arg = parts.join(' ');
    const rpc = async (fn, args) => {
      const { data, error } = await db.rpc(fn, args);
      if (error) { local('⚠️ ' + error.message); return null; }
      return data;
    };

    if (cmd === 'help') return local(AYUDA);
    if (cmd === 'clear') { $('msgs').innerHTML = ''; return; }
    if (cmd === 'nick') {
      if (!arg) return local('Uso: /nick <nuevo nombre>  o  /nick <nombre actual> > <nuevo nombre>');
      let actual = myName, nuevo = arg;
      if (arg.includes('>')) {
        const i = arg.indexOf('>');
        actual = arg.slice(0, i).trim();
        nuevo = arg.slice(i + 1).trim();
      }
      if (!actual || !nuevo) return local('Uso: /nick <nombre actual> > <nuevo nombre>');
      const self = actual.toLowerCase() === myName.toLowerCase();
      const old = myName;
      if (self) myName = nuevo.slice(0, 30);
      const n = await rpc('cmd_nick', { p_actual: actual, p_nuevo: nuevo, p_room: cur.id });
      if (n && self && channel) channel.track({ name: myName });
      else if (!n && self) myName = old;
      return;
    }
    if (cmd === 'dm') {
      if (!arg) return local('Uso: /dm <nombre>');
      return openDm(arg);
    }
    if (cmd === 'me') {
      if (!arg) return local('Uso: /me <acción>');
      await send(arg, 'me');
      return;
    }
    if (cmd === 'mute') {
      const p = arg.split(' ');
      let mins = 10;
      if (p.length > 1 && /^\d+$/.test(p[p.length - 1])) mins = parseInt(p.pop(), 10);
      const name = p.join(' ').trim();
      if (!name) return local('Uso: /mute <nombre> [minutos]');
      await rpc('cmd_mute', { p_nombre: name, p_minutos: mins, p_room: cur.id });
      return;
    }
    if (cmd === 'unmute') {
      if (!arg) return local('Uso: /unmute <nombre>');
      await rpc('cmd_unmute', { p_nombre: arg, p_room: cur.id });
      return;
    }
    if (cmd === 'delete') {
      const n = parseInt(arg, 10);
      if (!/^\d+$/.test(arg) || n < 1 || n > 100) return local('Uso: /delete <número de 1 a 100>');
      await rpc('cmd_delete', { p_n: n, p_room: cur.id });
      return;
    }
    if (cmd === 'resetpass') {
      const i = arg.lastIndexOf(' ');
      const name = i > 0 ? arg.slice(0, i).trim() : '';
      const clave = i > 0 ? arg.slice(i + 1) : '';
      if (!name || !clave) return local('Uso: /resetpass <nombre> <contraseña nueva>');
      const { error } = await db.rpc('cmd_resetpass', { p_nombre: name, p_clave: clave, p_room: cur.id });
      if (error) local('⚠️ ' + error.message);
      else local('🔑 Listo. Dile a ' + name + ' su contraseña temporal por privado y que la cambie desde el menú.');
      return;
    }
    if (cmd === 'pban') {
      if (!arg) return local('Uso: /pban <nombre>');
      await rpc('cmd_pban', { p_nombre: arg, p_room: cur.id });
      return;
    }
    if (cmd === 'admin' || cmd === 'unadmin') {
      if (!arg) return local('Uso: /' + cmd + ' <nombre>');
      await rpc('cmd_admin', { p_nombre: arg, p_dar: cmd === 'admin', p_room: cur.id });
      return;
    }
    local('Comando desconocido. Escribe /help para ver la lista.');
  }

  async function start(user) {
    me = user;
    const { data: prof } = await db.from('profiles').select('name').eq('user_id', user.id).maybeSingle();
    myName = (prof && prof.name) || (user.user_metadata && user.user_metadata.name) || (user.email || 'Anónimo').split('@')[0];
    $('auth').hidden = true;
    $('app').hidden = false;

    channel = db.channel('app', { config: { presence: { key: me.id } } });
    channel
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (p) => onMessage(p.new))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms' }, () => loadMembers())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'room_members' }, () => loadMembers())
      .on('postgres_changes',
          { event: 'DELETE', schema: 'public', table: 'messages' },
          (p) => { const el = els.get(p.old.id); if (el) { el.remove(); els.delete(p.old.id); } })
      .on('postgres_changes',
          { event: 'UPDATE', schema: 'public', table: 'profiles', filter: 'user_id=eq.' + me.id },
          (p) => {
            if (p.new.name && p.new.name !== myName) {
              myName = p.new.name;
              channel.track({ name: myName });
              local('✏️ Un administrador cambió tu nombre a ' + myName + '.');
            }
          })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => loadMembers())
      .on('presence', { event: 'sync' }, () => updateOnline())
      .subscribe(async (s) => {
        if (s === 'SUBSCRIBED') { $('status').textContent = ''; await channel.track({ name: myName }); }
        else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') { $('status').textContent = 'Reconectando…'; }
      });

    loadStickers();
    refreshPushUi();
    await loadAll();
    const g = rooms.find((x) => x.kind === 'general');
    if (g) await openRoom(g.id); else $('status').textContent = 'Falta la sala General: ejecuta salas.sql en Supabase.';
    local('Escribe /help para ver los comandos.');
  }

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = $('input').value.trim();
    if (!body) return;
    $('input').value = ''; fit();
    if (body.startsWith('/')) return runCommand(body);
    if (!(await send(body))) { $('input').value = body; fit(); }
  });

  (async () => {
    const { data: { session } } = await db.auth.getSession();
    if (session) start(session.user); else $('auth').hidden = false;
  })();
</script>
</body>
</html>
