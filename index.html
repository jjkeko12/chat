<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat de amigos</title>
<style>
  :root { --bg:#f5f5f4; --panel:#fff; --text:#1c1917; --muted:#78716c; --mine:#2563eb; --mine-text:#fff; --other:#e7e5e4; --line:#d6d3d1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1917; --panel:#292524; --text:#fafaf9; --muted:#a8a29e; --mine:#3b82f6; --mine-text:#fff; --other:#44403c; --line:#44403c; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; max-width: 720px; margin: 0 auto; }
  header { padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 1.1rem; margin: 0; }
  #online, #status { font-size: .8rem; color: var(--muted); margin-top: 2px; min-height: 1em; }
  #msgs { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; align-self: flex-start; }
  .msg.mine { align-self: flex-end; }
  .meta { font-size: .7rem; color: var(--muted); margin: 0 4px 2px; }
  .msg.mine .meta { text-align: right; }
  .body { background: var(--other); padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.mine .body { background: var(--mine); color: var(--mine-text); }
  form { display: flex; gap: 8px; padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--line); }
  input { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 1rem; }
  button { padding: 10px 18px; border: none; border-radius: 10px; background: var(--mine); color: var(--mine-text); font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>💬 Chat de amigos</h1>
  <div id="online"></div>
  <div id="status">Conectando…</div>
</header>
<div id="msgs"></div>
<form id="form">
  <input id="input" maxlength="500" placeholder="Escribe un mensaje…" autocomplete="off" />
  <button type="submit">Enviar</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // ---------- CONFIGURACIÓN: rellena estos 3 valores ----------
  const SUPABASE_URL = 'https://rjyhgwijofiepieltrra.supabase.co/rest/v1/';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqeWhnd2lqb2ZpZXBpZWx0cnJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMTA3NzksImV4cCI6MjEwNzY4Njc3OX0.bfHO5ewx11znaeWtTm74Q2vQYopl2HqQsYQPSmYGeYM';
  const ROOM = 'amigos-1-3-2'; // algo largo y difícil de adivinar
  // ------------------------------------------------------------

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const box = document.getElementById('msgs');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const status = document.getElementById('status');
  const online = document.getElementById('online');
  const seen = new Set();

  let name = '';
  try { name = localStorage.getItem('chat_name') || ''; } catch (e) {}
  if (!name) name = (prompt('¿Cómo te llamas? (máx. 30 letras)') || '').trim().slice(0, 30) || 'Anónimo';
  try { localStorage.setItem('chat_name', name); } catch (e) {}

  function add(m) {
    if (seen.has(m.id)) return;
    seen.add(m.id);
    const mine = m.author === name;
    const wrap = document.createElement('div');
    wrap.className = 'msg' + (mine ? ' mine' : '');
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (mine ? 'Tú' : m.author) + ' · ' +
      new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = m.body; // textContent evita que alguien inyecte HTML
    wrap.append(meta, body);
    box.append(wrap);
    box.scrollTop = box.scrollHeight;
  }

  // Tiempo real: mensajes nuevos + quién está en línea
  const channel = db.channel('sala:' + ROOM, { config: { presence: { key: name } } });
  channel
    .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room=eq.' + ROOM },
        (p) => add(p.new))
    .on('presence', { event: 'sync' }, () => {
      const names = Object.keys(channel.presenceState());
      online.textContent = 'En línea (' + names.length + '): ' + names.join(', ');
    })
    .subscribe(async (s) => {
      if (s === 'SUBSCRIBED') { status.textContent = ''; await channel.track({ name }); }
      else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') { status.textContent = 'Reconectando…'; }
    });

  // Historial (últimos 100 mensajes)
  (async () => {
    const { data, error } = await db.from('messages').select('*')
      .eq('room', ROOM).order('created_at', { ascending: false }).limit(100);
    if (error) { status.textContent = 'Error: ' + error.message; return; }
    data.reverse().forEach(add);
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = input.value.trim();
    if (!body) return;
    input.value = '';
    const { data, error } = await db.from('messages')
      .insert({ room: ROOM, author: name, body }).select().single();
    if (error) { status.textContent = 'No se pudo enviar: ' + error.message; input.value = body; return; }
    add(data);
  });
</script>
</body>
</html>
